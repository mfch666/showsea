<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>关于</title>
  <meta name="description" content="关于本站与作者" />
  <link rel="icon" href="../images/avatar.svg" />
  <link rel="stylesheet" href="../styles.css" />
  <!-- 主题初始化：先于绘制执行，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- 头部（玻璃拟态 sticky，复用首页结构） -->
  <header class="site-header glass">
    <div class="inner">
      <a class="brand" href="../">
        <img class="ring" id="hdr-avatar" src="../images/avatar.svg" alt="avatar" />
        <span id="hdr-name">Your Name</span>
      </a>
      <nav class="nav-desktop" id="nav-desktop"><!-- JS 渲染 --></nav>
      <div class="actions">
        <a class="icon-btn" id="gh-link" href="#" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.78 0 12.292c0 5.211 3.438 9.63 8.205 11.188.6.111.82-.254.82-.567 0-.28-.01-1.022-.015-2.005-3.338.711-4.042-1.582-4.042-1.582-.546-1.361-1.335-1.725-1.335-1.725-1.087-.731.084-.716.084-.716 1.205.082 1.838 1.215 1.838 1.215 1.07 1.803 2.809 1.282 3.495.981.108-.763.417-1.282.76-1.577-2.665-.295-5.466-1.309-5.466-5.827 0-1.287.465-2.339 1.235-3.164-.135-.298-.54-1.497.105-3.121 0 0 1.005-.316 3.3 1.209.96-.262 1.98-.392 3-.398 1.02.006 2.04.136 3 .398 2.28-1.525 3.285-1.209 3.285-1.209.645 1.624.24 2.823.12 3.121.765.825 1.23 1.877 1.23 3.164 0 4.53-2.805 5.527-5.475 5.817.42.354.81 1.077.81 2.182 0 1.578-.015 2.846-.015 3.229 0 .309.21.678.825.561C20.565 21.917 24 17.495 24 12.292 24 5.78 18.627.5 12 .5z"/></svg>
        </a>
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn nav-mobile" id="menu-btn" title="菜单" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-menu" id="mobile-menu"><!-- JS 渲染 --></nav>
  </header>

  <main class="about-page">
    <!-- Hero：模仿 liuhouliang.com/about 前部分 -->
    <section class="about-hero">
      <p class="about-greeting" id="about-greeting"></p>
      <h1 id="about-name"></h1>
      <p class="about-role" id="about-role"></p>
      <p class="about-bio" id="about-bio"></p>
      <div class="tag-row" id="about-tags"></div>
    </section>

    <!-- 👨 关于我 -->
    <section class="about-section">
      <h2 class="about-h2">👨 关于我</h2>
      <div class="info-grid" id="about-profile"></div>
    </section>

    <!-- 🏠 关于网站（不含评论/部署） -->
    <section class="about-section">
      <h2 class="about-h2">🏠 关于网站</h2>
      <div class="info-grid" id="about-siteinfo"></div>
    </section>

    <!-- ⏳ 建站历程 -->
    <section class="about-section">
      <h2 class="about-h2">⏳ 建站历程</h2>
      <div class="timeline" id="about-timeline"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span id="footer-text">© 2024 Your Name</span>
    <a class="beian-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备14102256号</a>
  </footer>

  <!-- 数据（sync 生成，window.SITE_DATA）。同时兼容 file:// 直接打开 -->
  <script src="../data.js"></script>
  <script src="../app.js"></script>
  <script src="about.js"></script>
</body>
</html>
